name: CI — Python, dbt & Terraform IaC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-and-dbt-ci:
    name: Python Lint, Tests & dbt Build (Local Parity)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"

      - name: Lint & Format Check (Ruff)
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests

      - name: Run Python Unit, Contract & Idempotency Tests
        run: .venv/bin/pytest

      - name: Run End-to-End Ingestion + dbt Build (Snapshots, Contracts, Unit & Reconciliation Tests)
        run: |
          cp dbt_project/profiles.yml.example dbt_project/profiles.yml
          .venv/bin/python -m saas_revenue.ingest
          cd dbt_project
          ../.venv/bin/dbt build --profiles-dir . --target dev_local

  terraform-iac-ci:
    name: Terraform Format, Validate & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform Init & Validate (dev)
        working-directory: infra/terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Trivy IaC Misconfiguration Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"

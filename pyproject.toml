[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-revenue-analytics-platform"
version = "1.0.0"
description = "End-to-end B2B SaaS Revenue Analytics Engineering platform (dbt Core, DuckDB, BigQuery, Cloud Run Jobs, Terraform)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pandera>=0.20.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "dbt-core>=1.8.0,<1.10.0",
    "dbt-duckdb>=1.8.0,<1.10.0",
    "streamlit>=1.36.0,<2.0.0",
    "plotly>=5.22.0,<6.0.0",
]

[project.optional-dependencies]
gcp = [
    "dbt-bigquery>=1.8.0,<1.10.0",
    "google-cloud-storage>=2.17.0,<3.0.0",
    "google-cloud-bigquery>=3.25.0,<4.0.0",
]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.5.0,<1.0.0",
    "sqlfluff>=3.1.0,<4.0.0",
    "sqlfluff-templater-dbt>=3.1.0,<4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
